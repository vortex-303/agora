# Agora Relay — Fly.io deploy template
# Usage: fly launch --copy-config --name my-agora-relay
app = "my-agora-relay"
primary_region = "sjc"  # Change to your nearest region

[build]

[http_service]
  internal_port = 9800
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[env]
  PORT = "9800"
  DATA_DIR = "/data"
  PEER_RELAYS = "wss://agora-relay.fly.dev,wss://agora-relay-eu.fly.dev"

[mounts]
  source = "agora_data"
  destination = "/data"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
