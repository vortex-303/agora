version: '3.8'
services:
  relay:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "9800:9800"
    volumes:
      - relay_data:/data
    environment:
      - PORT=9800
      - DATA_DIR=/data
      - PEER_RELAYS=wss://agora-relay.fly.dev,wss://agora-relay-eu.fly.dev
    restart: unless-stopped

volumes:
  relay_data:
