app = "agora-relay"
primary_region = "sjc"

[build]

[env]
  PEER_RELAYS = ""

[http_service]
  internal_port = 9800
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[mounts]
  source = "agora_data"
  destination = "/data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
