<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { width: 280px; font-family: -apple-system, sans-serif; background: #07070a; color: #f0f0f0; padding: 16px; }
.header { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
.logo { font-size: 1.1rem; font-weight: 800; }
.logo span { color: #f97316; }
.badge { padding: 2px 8px; border-radius: 12px; font-size: 0.7rem; }
.on { background: rgba(74,222,128,0.1); color: #4ade80; }
.off { background: rgba(239,68,68,0.1); color: #f87171; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
.stat { background: #0e0e12; border: 1px solid rgba(255,255,255,0.04); border-radius: 8px; padding: 10px; }
.val { font-size: 1.2rem; font-weight: 700; color: #f97316; }
.lbl { font-size: 0.65rem; color: #606068; margin-top: 2px; text-transform: uppercase; }
.info { font-size: 0.7rem; color: #606068; margin-bottom: 12px; line-height: 1.5; }
a.btn { display: block; background: #f97316; color: #000; border-radius: 8px; padding: 10px; text-align: center; text-decoration: none; font-weight: 600; }
.foot { margin-top: 12px; text-align: center; font-size: 0.6rem; color: #606068; }
.foot a { color: #606068; text-decoration: none; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">agora<span>.</span> node</div>
  <div class="badge off" id="badge">loading</div>
</div>

<div class="stats">
  <div class="stat"><div class="val" id="v1">...</div><div class="lbl">Network Objects</div></div>
  <div class="stat"><div class="val" id="v2">...</div><div class="lbl">Relays</div></div>
</div>

<p class="info">Your browser adds redundancy to the Agora network. The background worker syncs with relays even when the app tab is closed.</p>
<a class="btn" href="https://app.agorap2p.com" target="_blank">Open Agora</a>
<div class="foot"><a href="https://agorap2p.com" target="_blank">agorap2p.com</a></div>

<script src="popup.js"></script>
</body>
</html>
